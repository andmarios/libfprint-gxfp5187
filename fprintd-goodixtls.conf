# Drop-in for fprintd, shipped with the goodixtls libfprint driver.
[Service]
# The driver drives the sensor's reset line and reads its interrupt line on
# gpiochip0. fprintd.service has DeviceAllow= entries, so cgroup device
# filtering is closed by default and even root gets EPERM without this.
DeviceAllow=/dev/gpiochip0 rw
# Stay resident: the lock screen and SDDM only offer the fingerprint if the
# daemon answers straight away.
ExecStart=
ExecStart=/usr/lib/fprintd --no-timeout
